include:
  - project: magisk3171/magisk-ci-toolkit
    ref: c8a8b976cf70477089939bc45f9c6df40ddc1ff4
    file: /.gitlab/ci/android.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: c8a8b976cf70477089939bc45f9c6df40ddc1ff4
    file: /.gitlab/ci/android-release.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: c8a8b976cf70477089939bc45f9c6df40ddc1ff4
    file: /.gitlab/ci/telegram.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: c8a8b976cf70477089939bc45f9c6df40ddc1ff4
    file: /.gitlab/ci/renovate.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - magisk-local-linux

stages:
  - build
  - quality
  - notify
  - release-validate
  - release-build
  - release-publish
  - maintenance

variables:
  MAGISK_CI_TOOLKIT_REF: "c8a8b976cf70477089939bc45f9c6df40ddc1ff4"
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: "0"
  MAGISK_ANDROID_SDKMANAGER_CHANNEL: "3"
  MAGISK_ANDROID_COMPILE_SDK: "37"
  MAGISK_ANDROID_COMPILE_SDK_PACKAGE: "platforms;android-37.0"
  MAGISK_ANDROID_SDK_PACKAGES: "platform-tools build-tools;37.0.0"
  MAGISK_GRADLE_ARGS: "--warning-mode all"
  MAGISK_ANDROID_RELEASE_PACKAGE_NAME: "com.github.tianma8023.xposed.smscode"
  MAGISK_ANDROID_RELEASE_GITHUB_REPOSITORY: "magisk317/XposedSmsCode"
  MAGISK_ANDROID_RELEASE_MODULES_REPO: ""
  MAGISK_ANDROID_RELEASE_PUBLISH_PLAY: "true"
  MAGISK_ANDROID_RELEASE_PLAY_TRACK: "production"
  MAGISK_RENOVATE_REPOSITORY: "magisk3171/XposedSmsCode"

android:build:
  extends: .magisk_android_build
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch .renovate\/.+ into /'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
  variables:
    MAGISK_ANDROID_BUILD_TASKS: >-
      :core:check
      :runtime:check
      :app:check
      :smscode-core:contract:testDebugUnitTest
      :smscode-core:domain:testDebugUnitTest
      :smscode-core:hook:testDebugUnitTest
      :smscode-core:runtime:testDebugUnitTest
      :smscode-core:verification:detekt
      :smscode-core:verification:testDebugUnitTest
      :magisk-xposed-kit:testDebugUnitTest
      :magisk-xposed-kit:logging:testDebugUnitTest
      :magisk-xposed-kit:diagnostics:testDebugUnitTest
      :app:compileGithubDebugAndroidTestKotlin
      :app:compilePlayDebugAndroidTestKotlin
      :core:compilePlayDebugUnitTestKotlin
      :core:generatePlayDebugUnitTestStubRFile
      :runtime:compileDebugAndroidTestKotlin
      :app:koverVerifyGithubDebug
      :app:koverHtmlReportGithubDebug
      :app:assembleGithubDebug
      -PenableKover=true
      -PbuildSplits
  artifacts:
    name: "XposedSmsCode-debug-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - app/build/outputs/apk/**/debug/*.apk

android:detekt:
  extends: .magisk_android_detekt
  stage: quality
  allow_failure: true
  needs: []
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch .renovate\/.+ into /'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
  artifacts:
    name: "XposedSmsCode-detekt-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - merged-sarif/detekt.sarif
      - "**/build/reports/detekt/**"

android:release:guard:
  extends: .magisk_android_release_guard
  stage: release-validate

android:release:github-apk:
  extends: .magisk_android_release_apk
  stage: release-build
  needs:
    - job: android:release:guard
      artifacts: false
  artifacts:
    name: "XposedSmsCode-release-apks-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/**/release/*.apk
      - app/build/outputs/native-debug-symbols/**/native-debug-symbols.zip

android:release:play-bundle:
  extends: .magisk_android_release_aab
  stage: release-build
  needs:
    - job: android:release:guard
      artifacts: false
  artifacts:
    name: "XposedSmsCode-release-bundle-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/bundle/**/*.aab
      - app/build/outputs/mapping/**/mapping.txt
      - app/build/outputs/native-debug-symbols/**/native-debug-symbols.zip

android:release:gitlab:
  extends: .magisk_android_gitlab_release
  stage: release-publish
  needs:
    - job: android:release:github-apk
      artifacts: true
    - job: android:release:play-bundle
      artifacts: true
      optional: true

android:release:play:
  extends: .magisk_android_publish_play
  stage: release-publish
  needs:
    - job: android:release:play-bundle
      artifacts: true

android:release:modules-repo:
  extends: .magisk_android_publish_modules_repo
  stage: release-publish
  needs:
    - job: android:release:github-apk
      artifacts: true

telegram:release:
  extends: .magisk_telegram_release
  stage: release-publish
  allow_failure: true
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "📌 #XposedSmsCode"
    MAGISK_TELEGRAM_PROJECT_NAME: "XposedSmsCode"
  needs:
    - job: android:release:github-apk
      artifacts: true

telegram:ci:
  extends: .magisk_telegram_ci
  stage: notify
  allow_failure: true
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "📌 #XposedSmsCode"
    MAGISK_TELEGRAM_PROJECT_NAME: "XposedSmsCode"
    MAGISK_TELEGRAM_CI_BRANCH: "beta"
  needs:
    - job: android:build
      artifacts: true
      optional: true

renovate:gitlab:
  extends: .magisk_renovate_gitlab
  stage: maintenance
