include:
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: v1
    file: /.gitlab/ci/android.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: v1
    file: /.gitlab/ci/android-release.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: v1
    file: /.gitlab/ci/telegram.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: v1
    file: /.gitlab/ci/renovate.yml
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: v1
    file: /.gitlab/ci/cancel-mr-pipelines.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG

stages:
  - build
  - package
  - release-validate
  - release-build
  # sync must precede release-publish: android:release:github declares
  # `needs: sync:github`, and `needs` may only target the same or an
  # earlier stage. With sync missing, GitLab rejects the whole config.
  - sync
  - release-publish
  - notify
  - quality
  - maintenance

variables:
  MAGISK_CI_TOOLKIT_REPOSITORY: "https://gitlab.com/magisk3171/shared/magisk-ci-toolkit.git"
  MAGISK_CI_TOOLKIT_REF: "v1"
  MAGISK_CANCEL_OLDER_MR_PIPELINES: "true"
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: "0"
  MAGISK_ANDROID_SDKMANAGER_CHANNEL: "3"
  MAGISK_ANDROID_COMPILE_SDK: "37.2"
  MAGISK_ANDROID_COMPILE_SDK_PACKAGE: "platforms;android-37.2"
  MAGISK_ANDROID_SDK_PACKAGES: "platform-tools build-tools;37.0.0"
  MAGISK_GRADLE_ARGS: "--warning-mode all"
  MAGISK_ANDROID_RELEASE_PACKAGE_NAME: "com.github.tianma8023.xposed.smscode"
  MAGISK_ANDROID_RELEASE_PLAY_URL: "https://play.google.com/store/apps/details?id=com.github.tianma8023.xposed.smscode"
  MAGISK_ANDROID_RELEASE_GITHUB_REPOSITORY: "magisk317/XposedSmsCode"
  MAGISK_ANDROID_RELEASE_MODULES_REPO: "Xposed-Modules-Repo/com.github.tianma8023.xposed.smscode"
  MAGISK_ANDROID_RELEASE_PUBLISH_PLAY: "true"
  MAGISK_PLAY_INITIAL_VERSION_CODE: "126"
  # Public SHA-256 fingerprint of the production APK signing certificate.
  MAGISK_ANDROID_RELEASE_CERT_SHA256: "027b936e1d82a606d83599548b8b11e49a2c8ae2588c4a9fbe8311e2c54f103a"
  MAGISK_RENOVATE_REPOSITORY: "magisk3171/XposedSmsCode"
  XPOSED_GITLAB_LINUX_AMD64_RUNNER_TAG: "magisk-amd64-linux"
  XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG: "magisk-arm64-linux"

.xposed_android_rules:
  cache: []
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^renovate\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - when: never

.xposed_signed_android_rules:
  cache: []
  rules:
    - if: '$RELEASE_KEYSTORE == "" || $STORE_PASSWORD == "" || $KEY_ALIAS == "" || $KEY_PASSWORD == ""'
      when: never
    - !reference [.xposed_android_rules, rules]

android:check:
  extends:
    - .magisk_android_build
    - .xposed_android_rules
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  script:
    - |
      set -euo pipefail
      mapfile -t selected_tasks < <(bash scripts/ci/select_android_test_tasks.sh "$MAGISK_CI_TOOLKIT_DIR")
      if ((${#selected_tasks[@]} == 0)); then
        echo "No Android test tasks selected for this change."
        exit 0
      fi
      bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" \
        ${MAGISK_GRADLE_ARGS:---warning-mode all} "${selected_tasks[@]}" -PenableKover=true

android:test:
  extends:
    - .magisk_android_base
    - .xposed_android_rules
  stage: quality
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - when: never
  needs: []
  script:
    - |
      set -euo pipefail
      mapfile -t selected_tasks < <(bash scripts/ci/select_android_test_tasks.sh "$MAGISK_CI_TOOLKIT_DIR")
      if ((${#selected_tasks[@]} == 0)); then
        echo "No Android test tasks selected for this change."
        exit 0
      fi
      bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" \
        ${MAGISK_GRADLE_ARGS:---warning-mode all} "${selected_tasks[@]}" -PenableKover=true
  artifacts:
    name: "XposedSmsCode-test-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    reports:
      junit:
        - "**/build/test-results/test*/TEST-*.xml"
    paths:
      - "**/build/reports/kover/**"

cancel:older:mr:pipelines:
  extends: .magisk_cancel_older_mr_pipelines

android:build:
  extends:
    - .magisk_android_build
    - .xposed_signed_android_rules
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
    - when: never
  variables:
    MAGISK_ANDROID_BUILD_TASKS: >-
      :app:assembleGithubDebug
      -PbuildSplits
  artifacts:
    name: "XposedSmsCode-debug-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - app/build/outputs/apk/**/debug/*.apk

android:detekt:
  extends:
    - .magisk_android_detekt
    - .xposed_android_rules
  stage: quality
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG
  allow_failure: true
  needs: []
  artifacts:
    name: "XposedSmsCode-detekt-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - merged-sarif/detekt.sarif
      - "**/build/reports/detekt/**"

android:release:guard:
  extends: .magisk_android_release_guard
  stage: release-validate
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG

android:release:github-apk:
  # The shared template resolves the version once and records play-release.env,
  # so downstream jobs reuse this version decision instead of re-deriving it.
  extends: .magisk_android_release_apk
  variables:
    MAGISK_ANDROID_RELEASE_APK_TASKS: ":app:assembleGithubRelease"
    MAGISK_ANDROID_RELEASE_GRADLE_EXTRA_ARGS: "-PbuildSplits"
  resource_group: xposed-android-release-apk
  stage: release-build
  needs:
    - job: android:release:guard
      artifacts: false
  artifacts:
    name: "XposedSmsCode-release-apks-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/**/release/*.apk
      - play-release.env

android:release:play-bundle:
  extends: .magisk_android_release_aab
  resource_group: xposed-android-release-play
  stage: release-build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/ && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true"'
    - when: never
  variables:
    MAGISK_ANDROID_RELEASE_AAB_TASKS: ":app:bundlePlayRelease"
    MAGISK_PLAY_TRACK_OVERRIDE: "production"
  needs:
    - job: android:release:guard
      artifacts: false
  artifacts:
    name: "XposedSmsCode-release-bundle-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/bundle/**/*.aab
      - app/build/outputs/mapping/**/mapping.txt

android:release:gitlab:
  extends: .magisk_android_gitlab_release
  resource_group: xposed-android-release-publish
  stage: release-publish
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: android:release:github-apk
      artifacts: true
    - job: android:release:play-bundle
      artifacts: true
      optional: true

android:release:play:
  extends: .magisk_android_publish_play
  resource_group: xposed-android-release-play
  stage: release-publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/ && $RELEASE_OWNER == "gitlab" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
    - when: never
  variables:
    MAGISK_PLAY_TRACK_OVERRIDE: "production"
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: android:release:play-bundle
      artifacts: true

android:ci:play-beta-bundle:
  extends: .magisk_android_base
  resource_group: xposed-android-release-play
  stage: release-build
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != "" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_AUTHOR =~ /Renovate317@users.noreply/ && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != "" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail
      export MAGISK_PLAY_TRACK_OVERRIDE=beta
      keystore_path="$CI_PROJECT_DIR/release.jks"
      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$keystore_path"
      chmod 0600 "$keystore_path"
      bash "$MAGISK_CI_TOOLKIT_DIR/release/resolve_play_release.sh" \
        --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME" \
        --version-file "$CI_PROJECT_DIR/gradle/libs.versions.toml" \
        --output "$CI_PROJECT_DIR/play-release.env" \
        --initial-version-code "$MAGISK_PLAY_INITIAL_VERSION_CODE"
      source "$CI_PROJECT_DIR/play-release.env"
      KEYSTORE_FILE="$keystore_path" STORE_PASSWORD="$STORE_PASSWORD" KEY_ALIAS="$KEY_ALIAS" KEY_PASSWORD="$KEY_PASSWORD" \
        bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS :app:bundlePlayRelease \
          -PversionName="$MAGISK_PLAY_VERSION_NAME" -PversionCode="$MAGISK_PLAY_VERSION_CODE"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/outputs/bundle/**/*.aab
      - app/build/outputs/mapping/**/mapping.txt
      - play-release.env

android:ci:play-beta:
  extends: .magisk_android_base
  resource_group: xposed-android-release-play
  stage: release-publish
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_AUTHOR =~ /Renovate317@users.noreply/ && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_AUTHOR =~ /Renovate317@users.noreply/ && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
      when: on_success
    - when: never
  needs:
    - job: android:ci:play-beta-bundle
      artifacts: true
  script:
    - |
      set -euo pipefail
      set -a
      source play-release.env
      set +a
      export MAGISK_PLAY_AAB_FILE="$(find app/build/outputs/bundle -type f -name '*.aab' | sort | head -n 1)"
      export MAGISK_PLAY_MAPPING_FILE="$(find app/build/outputs/mapping -type f -name mapping.txt | sort | head -n 1 || true)"
      export MAGISK_PLAY_SYMBOLS_FILE="$(find app/build/outputs/native-debug-symbols -type f -name native-debug-symbols.zip 2>/dev/null | sort | head -n 1 || true)"
      export MAGISK_RELEASE_ENV_FILE=play-release-status.env
      bash "$MAGISK_CI_TOOLKIT_DIR/release/publish_play.sh"
  artifacts:
    when: always
    expire_in: 1 day
    reports:
      dotenv: play-release-status.env
    paths:
      - play-release-status.env

android:release:modules-repo:
  extends: .magisk_android_publish_modules_repo
  resource_group: xposed-android-release-publish
  stage: release-publish
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: android:release:github-apk
      artifacts: true

telegram:release:
  extends: .magisk_telegram_release
  stage: release-publish
  allow_failure: true
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "📌 #XposedSmsCode"
    MAGISK_TELEGRAM_PROJECT_NAME: "XposedSmsCode"
  needs:
    - job: android:release:github-apk
      artifacts: true
    - job: android:release:gitlab
      artifacts: false

telegram:ci:
  extends:
    - .magisk_telegram_ci
    - .xposed_signed_android_rules
  stage: notify
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_AUTHOR =~ /Renovate317@users.noreply/ && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != ""'
      when: manual
      allow_failure: true
    - when: never
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "📌 #XposedSmsCode"
    MAGISK_TELEGRAM_PROJECT_NAME: "XposedSmsCode"
    MAGISK_TELEGRAM_CI_BRANCH: "beta"
  needs:
    - job: android:check
      artifacts: false
      optional: true
    - job: android:build
      artifacts: true
      optional: true

renovate:gitlab:
  extends: .magisk_renovate_gitlab
  interruptible: false
  stage: maintenance
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG


sync:github:
  stage: sync
  image: alpine:latest
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG
  needs:
    - job: android:release:guard
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -euo pipefail
      # GITHUB_PAT is a protected group variable, so it is only injected on
      # protected refs. Tag pipelines receive it only when the tag matches a
      # protected tag rule (v*); otherwise fall back to a project-level token.
      sync_token="${GITHUB_PAT:-${GITHUB_RELEASE_TOKEN:-}}"
      if [ -z "$sync_token" ]; then
        echo "ERROR: neither GITHUB_PAT nor GITHUB_RELEASE_TOKEN is available on $CI_COMMIT_REF_NAME (protected=$CI_COMMIT_REF_PROTECTED)" >&2
        echo "       Make the tag match a protected tag rule (e.g. v*) so the protected group variable is injected." >&2
        exit 1
      fi
      git remote add github "https://magisk317:${sync_token}@github.com/${MAGISK_ANDROID_RELEASE_GITHUB_REPOSITORY}.git" || true
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        git push github "$CI_COMMIT_TAG" --force
        git push github --tags --force
      else
        git push github "HEAD:refs/heads/$CI_COMMIT_BRANCH" --force
      fi

android:release:github:
  extends: .magisk_android_release_github
  resource_group: xposed-android-release-publish
  stage: release-publish
  tags:
    - $XPOSED_GITLAB_LINUX_ARM64_RUNNER_TAG
  variables:
    # Must stay job-level: the toolkit template pins the same key at job level
    # ("*arm64-v8a*.apk") and job variables outrank the global variables block,
    # so a global override here would be silently ignored.
    MAGISK_ANDROID_RELEASE_GITHUB_ASSET_PATTERN: "*.apk"
  needs:
    - job: android:release:github-apk
      artifacts: true
    # The GitHub release must wait for the mirror push, otherwise it would
    # create the tag at the GitHub default-branch HEAD before it exists.
    - job: sync:github
