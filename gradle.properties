# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.

# Suppress AGP's warning for android.aapt2FromMavenOverride, which the
# shared CI toolkit passes as an experimental project option.
# Keep this outside the managed block so build-logic syncs cannot drop it.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE


# Gradle warns that configuration-cache warn mode must not be used to produce
# artifacts, and this pipeline produces release artifacts. Measured 2026-10-25: with
# -Dorg.gradle.configuration-cache.problems=FAIL all three variants configure without
# any configuration-cache problem, so warn mode is not needed and Gradle's failing
# default applies. Kept outside the managed block so build-logic syncs cannot drop it.

# Kotlin 2.5.0-Beta1 bisect switch - intentionally NOT enabled.
# 2.5.x reworked type inference (KT-85879) and can, in edge cases (builder
# inference, complex platform types with unusual bounds), pick a different
# overload, infer a different type, or emit a different diagnostic. If an
# inference regression is suspected after the 2.5.x move, enable this once to
# confirm the cause, then remove it again:
#   kotlin { compilerOptions { freeCompilerArgs.add("-XXLanguage:-EliminateSecondKindIncorporation") } }
# Never leave it on: it reverts a compiler performance fix.
# Kept outside the managed block so build-logic syncs cannot drop it.

# BEGIN SHARED GRADLE PROPERTIES (managed by magisk-build-logic)
# Shared Gradle defaults for Magisk317 Android consumers.
# Memory budget: the CI job containers are capped at 8 GiB with 9 GiB swap, so
# the daemon heap plus metaspace must leave room for the Kotlin compile daemon
# and AGP workers. 4096m/2048m used to be reclaimed down to a cgroup OOM kill
# (runner containers exiting 255) instead of failing with a useful message.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED -Djava.awt.headless=true
# Parallel project execution multiplies peak memory across modules; keep it off
# so the daemon stays inside the container limit above.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.warning.mode=all
android.useAndroidX=true
kotlin.jvm.target.validation.mode=ERROR
# END SHARED GRADLE PROPERTIES (managed by magisk-build-logic)
