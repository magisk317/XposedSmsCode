# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.

# Suppress AGP's warning for android.aapt2FromMavenOverride, which the
# shared CI toolkit passes as an experimental project option.
# Keep this outside the managed block so build-logic syncs cannot drop it.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE


# Gradle warns that configuration-cache warn mode must not be used to produce
# artifacts. Fail on configuration-cache problems instead. Kept outside the
# managed block so build-logic syncs cannot drop it.

# Kotlin 2.5.0-Beta1 bisect switch - intentionally NOT enabled.
# 2.5.x reworked type inference (KT-85879) and can, in edge cases (builder
# inference, complex platform types with unusual bounds), pick a different
# overload, infer a different type, or emit a different diagnostic. If an
# inference regression is suspected after the 2.5.x move, enable this once to
# confirm the cause, then remove it again:
#   kotlin { compilerOptions { freeCompilerArgs.add("-XXLanguage:-EliminateSecondKindIncorporation") } }
# Never leave it on: it reverts a compiler performance fix.
# Kept outside the managed block so build-logic syncs cannot drop it.

# BEGIN SHARED GRADLE PROPERTIES (managed by magisk-build-logic)
# Shared Gradle defaults for Magisk317 Android consumers.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED -Djava.awt.headless=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.warning.mode=all
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37,37.0,37.2
kotlin.jvm.target.validation.mode=ERROR
# END SHARED GRADLE PROPERTIES (managed by magisk-build-logic)
