apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def keystoreFilePath = System.getenv("KEYSTORE_FILE") ?: findProperty("tianma.keystore.path") ?: "release.jks"
def keyFile = file(keystoreFilePath)
def propertyFile = file(findProperty("tianma.signature.path") ?: "signature.properties")

def keyProps = new Properties()
if (propertyFile.exists()) {
    keyProps.load(new FileInputStream(propertyFile))
}

// Check if signing info is available either via properties or env vars
def isSigningInfoAvailable = keyFile.exists() && 
    (keyProps['STORE_PASSWORD'] != null || System.getenv("STORE_PASSWORD") != null)

def static releaseTime() {
    return new Date().format("yyMMdd", TimeZone.default)
}

def VERSION_NAME = "3.0.0"
def VERSION_CODE = 60

android {
    namespace 'com.github.tianma8023.xposed.smscode'

    compileSdk 36
    defaultConfig {
        applicationId "com.github.tianma8023.xposed.smscode"
        minSdkVersion 35
        targetSdkVersion 36
        versionCode VERSION_CODE
        versionName VERSION_NAME

        buildConfigField("String", "LOG_TAG", "\"XSmsCode\"")
        buildConfigField("int", "MODULE_VERSION", "" + VERSION_CODE)
        resConfigs 'en', 'zh-rCN', 'zh-rTW'

        // vectorDrawables.generatedDensities = ['hdpi']


        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [ eventBusIndex : 'com.tianma.xsmscode.data.eventbus.MyEventBusIndex' ]
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }

    signingConfigs {
        release {
            storeFile keyFile
            storePassword System.getenv("STORE_PASSWORD") ?: keyProps['STORE_PASSWORD']
            keyAlias System.getenv("KEY_ALIAS") ?: keyProps['KEY_ALIAS']
            keyPassword System.getenv("KEY_PASSWORD") ?: keyProps['KEY_PASSWORD']
        }
    }

    buildTypes {
        debug {
            buildConfigField("int", "LOG_LEVEL", "2")
            buildConfigField("boolean", "LOG_TO_XPOSED", "true")

            if (isSigningInfoAvailable) {
                signingConfig signingConfigs.release
            }
        }

        alpha {
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            debuggable  false

            buildConfigField("int", "LOG_LEVEL", "2")
            buildConfigField("boolean", "LOG_TO_XPOSED", "true")

            if (isSigningInfoAvailable) {
                signingConfig signingConfigs.release
            }

            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true

            buildConfigField("int", "LOG_LEVEL", "4")
            buildConfigField("boolean", "LOG_TO_XPOSED", "true")
            if (isSigningInfoAvailable) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }

            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            lintOptions {
                disable 'MissingTranslation'
                checkReleaseBuilds false
            }

            packagingOptions {
                exclude '**/*.kotlin_*'
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI) ?: "universal"
            output.outputFileName = "XposedSmsCode_v${variant.versionName.replaceAll('\\s+', '_')}_${releaseTime()}_${variant.buildType.name.charAt(0)}_${abi}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
        }
    }
}

ext {
    eventBusVersion = "3.3.1" // event bus
    gsonVersion = "2.11.0" // gson
    okHttpVersion = "4.12.0" // OkHttp
    retrofitVersion = "2.11.0" // retrofit
    jsoupVersion = "1.18.1" // jsoup
    composeVersion = "1.7.6" // Compose version
    coroutinesVersion = "1.10.1" // Coroutines version
    roomVersion = "2.6.1" // Room version
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0" // material design support
    implementation "androidx.recyclerview:recyclerview:1.3.2" // recycler view
    implementation "androidx.browser:browser:1.8.0" // custom tabs
    implementation "androidx.preference:preference:1.2.1" // preference support
    implementation "androidx.constraintlayout:constraintlayout:2.2.0" // constraint layout
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0" // swipe refresh layout
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7" // ViewModel
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.7" // LiveData
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    // Xposed
    compileOnly 'de.robv.android.xposed:api:82'
    // EventBus
    implementation "org.greenrobot:eventbus:$eventBusVersion"

    // Gson
    implementation "com.google.code.gson:gson:$gsonVersion"

    // OkHttp
    implementation "com.squareup.okhttp3:okhttp:$okHttpVersion"
    // OkHttp logging interceptor
    implementation "com.squareup.okhttp3:logging-interceptor:$okHttpVersion"

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
    // Retrofit Gson converter
    implementation "com.squareup.retrofit2:converter-gson:$retrofitVersion"
    // Retrofit scalars converter
    implementation "com.squareup.retrofit2:converter-scalars:$retrofitVersion"
    // Retrofit RxJava Adapter

    // JSoup
    implementation "org.jsoup:jsoup:$jsoupVersion"

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    
    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"

    // Compose
    implementation "androidx.compose.ui:ui:$composeVersion"
    implementation "androidx.compose.material3:material3:1.3.1"
    implementation "androidx.compose.ui:ui-tooling-preview:$composeVersion"
    debugImplementation "androidx.compose.ui:ui-tooling:$composeVersion"
    implementation "androidx.activity:activity-compose:1.10.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"

    // Room
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"
    // For Kotlin projects using KSP (will add later if needed)
}
