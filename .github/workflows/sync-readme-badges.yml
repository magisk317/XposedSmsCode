name: Sync README Badges

on:
  push:
    branches:
      - beta
    paths:
      - gradle/libs.versions.toml
      - gradle/wrapper/gradle-wrapper.properties
      - scripts/codegen/sync_readme_badges.sh
      - .github/workflows/sync-readme-badges.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sync-readme-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync badges
        run: ./scripts/codegen/sync_readme_badges.sh

      - name: Commit and push if changed
        run: |
          if [[ -z "$(git status --porcelain README.md README-EN.md)" ]]; then
            echo "No README badge updates"
            exit 0
          fi

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add README.md README-EN.md
          git commit -m "docs(readme): sync version badges"
          git push
