name: Sync README Badges

on:
  push:
    paths:
      - gradle/libs.versions.toml
      - gradle/wrapper/gradle-wrapper.properties
      - scripts/sync_readme_badges.sh
      - .github/workflows/sync-readme-badges.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync badges
        run: ./scripts/sync_readme_badges.sh

      - name: Commit and push if changed
        run: |
          if [[ -z "$(git status --porcelain README.md README-EN.md)" ]]; then
            echo "No README badge updates"
            exit 0
          fi

          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "README badge updates detected on ${GITHUB_REF_TYPE}; skip auto-push from detached HEAD"
            git diff -- README.md README-EN.md
            exit 0
          fi

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add README.md README-EN.md
          git commit -m "docs(readme): sync version badges"
          git push origin "HEAD:${GITHUB_REF_NAME}"
