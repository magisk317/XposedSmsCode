name: Build APK/AAB

on:
  push:
    tags:
      - 'v*.*.*'  # Semantic version tag, e.g. v3.1.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate release notes and tag/version consistency
        run: |
          chmod +x scripts/check_release_guard.sh
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/check_release_guard.sh "${GITHUB_REF_NAME}"
          else
            scripts/check_release_guard.sh
          fi

  build-apk:
    name: Build APKs
    needs: [validate-release]
    runs-on: ubuntu-latest
    outputs:
      has_github_native_symbols: ${{ steps.github_symbols.outputs.exists }}
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Ensure Android 37 platform aliases
        shell: bash
        run: bash scripts/ensure_android_sdk_platform_alias.sh

      - name: Build APKs with Splits
        run: >
          ./gradlew
          assembleGithubApi101Release
          assembleGithubLegacyRelease
          -PbuildSplits
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: app/build/outputs/apk/**/release/*.apk

      - name: Detect GitHub Native Symbols
        id: github_symbols
        shell: bash
        run: |
          shopt -s nullglob
          files=(app/build/outputs/native-debug-symbols/github*Release/native-debug-symbols.zip)
          if (( ${#files[@]} == 0 )); then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          {
            echo "paths<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Native Symbols Artifact
        if: steps.github_symbols.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: native-symbols-github
          path: ${{ steps.github_symbols.outputs.paths }}

  build-aab:
    name: Build Bundle
    needs: [validate-release]
    runs-on: ubuntu-latest
    outputs:
      has_play_native_symbols: ${{ steps.play_symbols.outputs.exists }}
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Ensure Android 37 platform aliases
        shell: bash
        run: bash scripts/ensure_android_sdk_platform_alias.sh

      - name: Build App Bundle
        run: ./gradlew bundlePlayApi101Release
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bundle-assets
          path: |
            app/build/outputs/bundle/playApi101Release/*.aab
            app/build/outputs/mapping/playApi101Release/mapping.txt

      - name: Detect Play Native Symbols
        id: play_symbols
        shell: bash
        run: |
          file="app/build/outputs/native-debug-symbols/playApi101Release/native-debug-symbols.zip"
          if [[ -f "$file" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Play Native Symbols Artifact
        if: steps.play_symbols.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: native-symbols-play
          path: ${{ steps.play_symbols.outputs.path }}

  release:
    name: Create Release
    needs: [build-apk, build-aab]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
      HAS_GOOGLE_PLAY_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: artifacts/apks

      - uses: actions/download-artifact@v8
        with:
          name: bundle-assets
          path: artifacts/bundle

      - uses: actions/download-artifact@v8
        if: needs.build-aab.outputs.has_play_native_symbols == 'true'
        with:
          name: native-symbols-play
          path: artifacts/symbols-play

      - name: Extract Version Name from Tag
        id: extract_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF_NAME}       # e.g. v3.1.4
          if [[ "$TAG" == v* ]]; then
            echo "version_name=${TAG}" >> $GITHUB_OUTPUT
          else
            echo "version_name=v${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Create Draft Release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_RELEASE_KEYSTORE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          release_name="${{ steps.extract_version.outputs.version_name }}"
          release_notes=$(cat <<'EOF'
            <div align="center">
              <a href="https://play.google.com/store/apps/details?id=com.github.tianma8023.xposed.smscode">
                <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" height="80"/>
              </a>
              <a href="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}">
                <img src="https://raw.githubusercontent.com/machiav3lli/oandbackupx/master/badge_github.png" alt="Get it on GitHub" height="80"/>
              </a>
            </div>
          EOF
          )

          mapfile -d '' release_assets < <(
            find artifacts/apks artifacts/bundle -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z
          )
          if [[ ${#release_assets[@]} -eq 0 ]]; then
            echo "ERROR: no release assets found under artifacts/apks or artifacts/bundle" >&2
            find artifacts/apks artifacts/bundle -maxdepth 6 -type f | sort >&2 || true
            exit 1
          fi

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" "${release_assets[@]}" --clobber
            gh release edit "$tag_name" --title "$release_name"
          else
            gh release create "$tag_name" "${release_assets[@]}" \
              --draft \
              --title "$release_name" \
              --verify-tag \
              --generate-notes \
              --notes "$release_notes"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}

      - name: Determine Release Track
        id: determine_track
        run: |
          TAG_NAME=${{ github.ref_name }}
          if [[ "$TAG_NAME" == *"-beta"* ]]; then
            echo "track=beta" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == *"-alpha"* ]]; then
            echo "track=alpha" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == *"-internal"* ]]; then
            echo "track=internal" >> $GITHUB_OUTPUT
          else
            echo "track=production" >> $GITHUB_OUTPUT
          fi

      - name: Resolve Play Publish Inputs
        id: resolve_play
        shell: bash
        run: |
          aab_file=$(find artifacts/bundle -type f -name 'XposedSmsCode_v*.aab' | sort | head -n 1)
          if [[ -z "$aab_file" ]]; then
            aab_file=$(find artifacts/bundle -type f -name '*.aab' | sort | head -n 1)
          fi
          if [[ -z "$aab_file" ]]; then
            echo "ERROR: no .aab found under artifacts/bundle" >&2
            find artifacts/bundle -maxdepth 4 -type f | sort >&2 || true
            exit 1
          fi

          mapping_file=$(find artifacts/bundle -type f -name mapping.txt | head -n 1)
          if [[ -z "$mapping_file" ]]; then
            echo "ERROR: mapping.txt not found under artifacts/bundle" >&2
            find artifacts/bundle -maxdepth 4 -type f | sort >&2 || true
            exit 1
          fi

          symbols_file=$(find artifacts/symbols-play -type f -name native-debug-symbols.zip 2>/dev/null | head -n 1 || true)

          echo "aab_file=$aab_file" >> "$GITHUB_OUTPUT"
          echo "mapping_file=$mapping_file" >> "$GITHUB_OUTPUT"
          if [[ -n "$symbols_file" ]]; then
            echo "has_symbols=true" >> "$GITHUB_OUTPUT"
            echo "symbols_file=$symbols_file" >> "$GITHUB_OUTPUT"
          else
            echo "has_symbols=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby for fastlane
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_GOOGLE_PLAY_CREDENTIALS == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install fastlane
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_GOOGLE_PLAY_CREDENTIALS == 'true'
        shell: bash
        run: |
          ruby --version
          gem --version
          gem_user_bin="$(ruby -r rubygems -e 'print Gem.user_dir')/bin"
          echo "$gem_user_bin" >> "$GITHUB_PATH"
          gem install fastlane --no-document --user-install
          fastlane --version

      - name: Publish to Google Play
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_GOOGLE_PLAY_CREDENTIALS == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cmd=(
            fastlane supply
            --aab "${{ steps.resolve_play.outputs.aab_file }}"
            --package_name "com.github.tianma8023.xposed.smscode"
            --track "${{ steps.determine_track.outputs.track }}"
            --release_status "completed"
            --json_key_data "$ANDROID_PUBLISHER_CREDENTIALS"
            --skip_upload_metadata true
            --skip_upload_images true
            --skip_upload_screenshots true
          )

          if [[ "${{ steps.resolve_play.outputs.has_symbols }}" == "true" ]]; then
            cmd+=(--mapping_paths "${{ steps.resolve_play.outputs.mapping_file }},${{ steps.resolve_play.outputs.symbols_file }}")
          else
            cmd+=(--mapping "${{ steps.resolve_play.outputs.mapping_file }}")
          fi

          "${cmd[@]}"
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_COLORS: '1'
          CI: 'true'

  publish-to-modules-repo:
    name: Publish to Xposed-Modules-Repo
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      HAS_MODULES_REPO_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN != '' }}
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
      MODULES_REPO: Xposed-Modules-Repo/com.github.tianma8023.xposed.smscode
    steps:
      - name: Download APK Artifacts
        uses: actions/download-artifact@v8
        with:
          name: apks
          path: artifacts/apks

      - name: Extract Version Name from Tag
        id: extract_version
        run: |
          TAG=${GITHUB_REF_NAME}       # e.g. v3.1.4
          if [[ "$TAG" == v* ]]; then
            echo "version_name=${TAG}" >> $GITHUB_OUTPUT
          else
            echo "version_name=v${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Create Draft Release in Xposed-Modules-Repo
        if: env.HAS_MODULES_REPO_TOKEN == 'true' && env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          mapfile -d '' apk_files < <(find artifacts/apks -type f -name '*.apk' -print0 | sort -z)
          if [[ ${#apk_files[@]} -eq 0 ]]; then
            echo "ERROR: no APK files found under artifacts/apks" >&2
            find artifacts/apks -maxdepth 6 -type f | sort >&2 || true
            exit 1
          fi
          gh release create "${{ github.ref_name }}" \
            "${apk_files[@]}" \
            --repo "${{ env.MODULES_REPO }}" \
            --title "${{ steps.extract_version.outputs.version_name }}" \
            --notes "<div align=\"center\">
            <a href=\"https://play.google.com/store/apps/details?id=com.github.tianma8023.xposed.smscode\">
              <img src=\"https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png\" alt=\"Get it on Google Play\" height=\"80\"/>
            </a>
            <a href=\"https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}\">
              <img src=\"https://raw.githubusercontent.com/machiav3lli/oandbackupx/master/badge_github.png\" alt=\"Get it on GitHub\" height=\"80\"/>
            </a>
            </div>
            " \
            --draft
        env:
          GH_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN }}
