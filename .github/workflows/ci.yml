name: CI
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on: workflow_dispatch
jobs:
  build-debug:
    name: Build Debug APKs
    runs-on: ubuntu-26.04
    # Every GitHub job in this workflow needs a ceiling: run 495's test job hung for
    # 4.8 hours with nothing to stop it, because a hung step is not the same as a slow
    # one and the runner only reaps the process tree when the job ends.
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
        with:
          ref: af0295f4631f61a163e981d52bc863e5b8f00dde
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
          # The toolkit defaults to 26, but this project targets 27 (see
          # gradle/libs.versions.toml: java / javaBytecode). Lint refuses to run on
          # a JVM older than the target, and GitLab never sees that because its
          # runner image already ships 27 -- only a GitHub-hosted runner does.
          java-version: '27'
      - name: Require release signing
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: |
          echo "::error::Release signing is unavailable (RELEASE_KEYSTORE / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD). Every build and upload step below is gated on it, so without this the job would report success while producing no artifact at all."
          exit 1
      - name: Decode Keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > release.jks
      - name: Build signed debug APKs
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: >
            --warning-mode all
            :app:assembleGithubDebug
            -PbuildSplits
            -PminifyDebug
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Write build summary
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        run: |
          {
            echo "## Debug APK summary"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            while IFS= read -r apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              echo "| $name | $size |"
            done < <(find app/build/outputs/apk -path '*/debug/*.apk' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Debug APK (arm64-v8a)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: XposedSmsCode-debug-apks-arm64-v8a
          path: app/build/outputs/apk/**/debug/arm64-v8a_*.apk
          if-no-files-found: error
      - name: Upload Debug APK (armeabi-v7a)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: XposedSmsCode-debug-apks-armeabi-v7a
          path: app/build/outputs/apk/**/debug/armeabi-v7a_*.apk
          if-no-files-found: error
      - name: Upload Debug APK (x86_64)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: XposedSmsCode-debug-apks-x86_64
          path: app/build/outputs/apk/**/debug/x86_64_*.apk
          if-no-files-found: error
      - name: Upload Debug APK (x86)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: XposedSmsCode-debug-apks-x86
          path: app/build/outputs/apk/**/debug/x86_[!6]*.apk
          if-no-files-found: error
      - name: Upload Debug APK (universal)
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: XposedSmsCode-debug-apks-universal
          path: app/build/outputs/apk/**/debug/universal_*.apk
          if-no-files-found: error
  test:
    name: Post-build Tests
    needs: [build-debug]
    if: always() && needs.build-debug.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
        with:
          ref: af0295f4631f61a163e981d52bc863e5b8f00dde
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
          # The toolkit defaults to 26, but this project targets 27 (see
          # gradle/libs.versions.toml: java / javaBytecode). Lint refuses to run on
          # a JVM older than the target, and GitLab never sees that because its
          # runner image already ships 27 -- only a GitHub-hosted runner does.
          java-version: '27'
      - name: Run Android tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t selected_tasks < <(
            python3 "${MAGISK_CI_TOOLKIT_DIR:-.magisk-ci-toolkit}/ci/select_gradle_tasks.py" \
              --root "$PWD" \
              --toolkit "${MAGISK_CI_TOOLKIT_DIR:-.magisk-ci-toolkit}" \
              --config scripts/config/android-test-tasks.json
          )
          if ((${#selected_tasks[@]} == 0)); then
            echo "No Android test tasks selected for this change."
            exit 0
          fi
          bash "${MAGISK_CI_TOOLKIT_DIR:-.magisk-ci-toolkit}/gradle/run_gradle_with_retry.sh" \
            --warning-mode all "${selected_tasks[@]}" -PenableKover=true
      - name: Upload Kover Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: app/build/reports/kover/**
