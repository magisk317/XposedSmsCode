name: CI
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - beta
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APKs
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
      - name: Decode Keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > release.jks
      - name: Build signed debug APKs
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: >
            --warning-mode all
            :app:assembleGithubDebug
            -PbuildSplits
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Write build summary
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        run: |
          {
            echo "## Debug APK summary"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            while IFS= read -r apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              echo "| $name | $size |"
            done < <(find app/build/outputs/apk -path '*/debug/*.apk' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Debug APKs
        if: always() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: XposedSmsCode-debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
  test:
    name: Post-build Tests
    needs: [build-debug]
    if: always() && needs.build-debug.result == 'success'
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
      - name: Run Android tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t selected_tasks < <(bash scripts/ci/select_android_test_tasks.sh "${MAGISK_CI_TOOLKIT_DIR:-.magisk-ci-toolkit}")
          if ((${#selected_tasks[@]} == 0)); then
            echo "No Android test tasks selected for this change."
            exit 0
          fi
          bash "${MAGISK_CI_TOOLKIT_DIR:-.magisk-ci-toolkit}/gradle/run_gradle_with_retry.sh" \
            --warning-mode all "${selected_tasks[@]}" -PenableKover=true
      - name: Upload Kover Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: app/build/reports/kover/**
