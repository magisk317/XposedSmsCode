name: CI
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - beta
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Resolve CI toolkit
        run: bash scripts/resolve_ci_toolkit.sh
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
      - name: Build and test project
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: >
            --warning-mode all
            :core:check
            :runtime:check
            :app:check
            :app:compileGithubDebugAndroidTestKotlin
            :app:compilePlayDebugAndroidTestKotlin
            :core:compilePlayDebugUnitTestKotlin
            :core:generatePlayDebugUnitTestStubRFile
            :runtime:compileDebugAndroidTestKotlin
            :app:assembleGithubDebug
            -PbuildSplits
      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Debug APK summary"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            while IFS= read -r apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              echo "| $name | $size |"
            done < <(find app/build/outputs/apk -path '*/debug/*.apk' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Debug APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XposedSmsCode-debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
      - name: Upload Kover Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: app/build/reports/kover/**
