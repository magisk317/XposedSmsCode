name: Auto Fix Detekt Issues

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 每天 00:00 UTC 运行

permissions:
  contents: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Run Detekt with Auto Correct
        continue-on-error: true
        run: bash scripts/_toolkit/gradle/run_gradle_with_retry.sh detekt --auto-correct
          
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "style: auto-fix detekt issues"
          title: "style: auto-fix detekt issues"
          body: |
            Automated fixes applied by Detekt.
            
            This PR contains automatic style fixes generated by the Detekt static analysis tool.
            Please review the changes and merge if they look correct.
          branch: "autofix/detekt-style"
          delete-branch: true
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Enable Auto Merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --merge --delete-branch
