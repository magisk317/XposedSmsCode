# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow performs a static analysis of your Kotlin source code using
# Detekt.
#
# Scans are triggered:
# 1. On every push to default and protected branches
# 2. On every Pull Request targeting the default branch
# 3. On a weekly schedule
# 4. Manually, on demand, via the "workflow_dispatch" event
#
# The workflow should work with no modifications, but you might like to use a
# later version of the Detekt CLI by modifying the $DETEKT_RELEASE_TAG
# environment variable.
name: Scan with Detekt

on:
  # Triggers the workflow on push or pull request events but only for default and protected branches
  push:
    branches: [ "beta" ]
  pull_request:
    branches: [ "beta" ]
  schedule:
     - cron: '0 0 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Run Detekt
        continue-on-error: true
        run: ./gradlew detekt --continue

      - name: Check reports existence
        id: check
        if: always()
        run: |
          if [ -f app/build/reports/detekt/detekt.sarif ]; then echo "app=true" >> $GITHUB_OUTPUT; fi
          if [ -f core/build/reports/detekt/detekt.sarif ]; then echo "core=true" >> $GITHUB_OUTPUT; fi
          if [ -f runtime/build/reports/detekt/detekt.sarif ]; then echo "runtime=true" >> $GITHUB_OUTPUT; fi

      - name: Merge SARIF files
        if: always()
        run: |
          mkdir -p merged-sarif
          # Merge all available SARIF files into one. If app SARIF is missing, use a fallback or skip gracefully.
          if [ ! -f app/build/reports/detekt/detekt.sarif ] && [ ! -f runtime/build/reports/detekt/detekt.sarif ] && [ ! -f core/build/reports/detekt/detekt.sarif ]; then
            echo "No Detekt SARIF reports found to merge."
            exit 0
          fi

          jq -s '
            if length == 0 then empty else
            {
              "$schema": .[0]."$schema",
              "version": .[0].version,
              "runs": [
                {
                  "tool": .[0].runs[0].tool,
                  "results": ([.[].runs[].results] | add)
                }
              ]
            }
            end
          ' $([ -f app/build/reports/detekt/detekt.sarif ] && echo "app/build/reports/detekt/detekt.sarif") \
            $([ -f runtime/build/reports/detekt/detekt.sarif ] && echo "runtime/build/reports/detekt/detekt.sarif") \
            $([ -f core/build/reports/detekt/detekt.sarif ] && echo "core/build/reports/detekt/detekt.sarif") \
            > merged-sarif/detekt.sarif 2>/dev/null || {
              # Fallback if jq fails or files are missing
              [ -f app/build/reports/detekt/detekt.sarif ] && cp app/build/reports/detekt/detekt.sarif merged-sarif/detekt.sarif || \
              [ -f runtime/build/reports/detekt/detekt.sarif ] && cp runtime/build/reports/detekt/detekt.sarif merged-sarif/detekt.sarif || \
              [ -f core/build/reports/detekt/detekt.sarif ] && cp core/build/reports/detekt/detekt.sarif merged-sarif/detekt.sarif
            }

      - name: Upload merged SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: merged-sarif/detekt.sarif
          category: app
