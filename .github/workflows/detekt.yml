name: Scan with Detekt

on:
  push:
    branches: [ "beta" ]
  pull_request:
    branches: [ "beta" ]
  schedule:
     - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Run Detekt
        continue-on-error: true
        run: bash scripts/_toolkit/gradle/run_gradle_with_retry.sh detekt --continue

      - name: Merge SARIF files
        id: merge_sarif
        if: always()
        run: |
          mkdir -p merged-sarif
          mapfile -t sarif_files < <(find . -path '*/build/reports/detekt/detekt.sarif' -type f | sort)
          if (( ${#sarif_files[@]} == 0 )); then
            echo "No SARIF files found"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - "${sarif_files[@]}" <<'PY'
          import json
          import sys
          from pathlib import Path

          inputs = [Path(path) for path in sys.argv[1:]]
          merged = None
          merged_runs = []

          for path in inputs:
              data = json.loads(path.read_text())
              if merged is None:
                  merged = data
                  merged["runs"] = []
              merged_runs.extend(data.get("runs") or [])

          if merged is None:
              raise SystemExit("No SARIF inputs")

          merged["runs"] = merged_runs
          Path("merged-sarif/detekt.sarif").write_text(json.dumps(merged))
          PY
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Upload merged SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.merge_sarif.outputs.exists == 'true'
        continue-on-error: true
        with:
          sarif_file: merged-sarif/detekt.sarif
          category: app
