name: Scan with Detekt

on: workflow_dispatch
permissions:
  security-events: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-26.04
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'

      - name: Run Detekt
        continue-on-error: true
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: detekt --continue

      - name: Merge SARIF files
        id: merge_sarif
        if: always()
        run: |
          mkdir -p merged-sarif
          mapfile -t sarif_files < <(find . -path '*/build/reports/detekt/detekt.sarif' -type f | sort)
          if (( ${#sarif_files[@]} == 0 )); then
            echo "No SARIF files found"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - "${sarif_files[@]}" <<'PY'
          import json
          import sys
          from pathlib import Path

          inputs = [Path(path) for path in sys.argv[1:]]
          merged = None
          merged_runs = []

          for path in inputs:
              data = json.loads(path.read_text())
              if merged is None:
                  merged = data
                  merged["runs"] = []
              merged_runs.extend(data.get("runs") or [])

          if merged is None:
              raise SystemExit("No SARIF inputs")

          merged["runs"] = merged_runs
          Path("merged-sarif/detekt.sarif").write_text(json.dumps(merged))
          PY
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Upload merged SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.merge_sarif.outputs.exists == 'true'
        continue-on-error: true
        with:
          sarif_file: merged-sarif/detekt.sarif
          category: app
