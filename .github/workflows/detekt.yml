# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow performs a static analysis of your Kotlin source code using
# Detekt.
#
# Scans are triggered:
# 1. On every push to default and protected branches
# 2. On every Pull Request targeting the default branch
# 3. On a weekly schedule
# 4. Manually, on demand, via the "workflow_dispatch" event
#
# The workflow should work with no modifications, but you might like to use a
# later version of the Detekt CLI by modifying the $DETEKT_RELEASE_TAG
# environment variable.
name: Scan with Detekt

on:
  # Triggers the workflow on push or pull request events but only for default and protected branches
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
     - cron: '0 0 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Detekt
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew detekt --continue

      - name: Check reports existence
        id: check
        if: always()
        run: |
          if [ -f app/build/reports/detekt/detekt.sarif ]; then echo "app=true" >> $GITHUB_OUTPUT; fi
          if [ -f core/build/reports/detekt/detekt.sarif ]; then echo "core=true" >> $GITHUB_OUTPUT; fi
          if [ -f storage/build/reports/detekt/detekt.sarif ]; then echo "storage=true" >> $GITHUB_OUTPUT; fi

      - name: Upload Scan results (app)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.check.outputs.app == 'true'
        continue-on-error: true
        with:
          sarif_file: app/build/reports/detekt/detekt.sarif
          category: app

      - name: Upload Scan results (core)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.check.outputs.core == 'true'
        continue-on-error: true
        with:
          sarif_file: core/build/reports/detekt/detekt.sarif
          category: core

      - name: Upload Scan results (storage)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.check.outputs.storage == 'true'
        continue-on-error: true
        with:
          sarif_file: storage/build/reports/detekt/detekt.sarif
          category: storage

