name: Shared Submodule Compat
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "build-logic/**"
      - "core/**"
      - "hook/**"
      - "app/**"
      - "runtime/**"
      - "magisk-ui-kit/**"
      - "magisk-xposed-kit/**"
      - "smscode/**"
      - ".github/workflows/shared-submodule-compat.yml"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  push:
    branches:
      - beta
    paths:
      - "build-logic/**"
      - "core/**"
      - "hook/**"
      - "app/**"
      - "runtime/**"
      - "magisk-ui-kit/**"
      - "magisk-xposed-kit/**"
      - "smscode/**"
      - ".github/workflows/shared-submodule-compat.yml"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}

jobs:
  shared-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
      - name: Verify shared submodule compatibility
        run: bash scripts/checks/verify_shared_submodule_compat.sh
