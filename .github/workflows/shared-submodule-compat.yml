name: Shared Submodule Compat
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "build-logic/**"
      - "core/**"
      - "app/**"
      - "runtime/**"
      - "magisk-ui-kit/**"
      - "smscode/**"
      - ".github/workflows/shared-submodule-compat.yml"
      - "scripts/**"
  push:
    branches:
      - beta
    paths:
      - "build-logic/**"
      - "core/**"
      - "app/**"
      - "runtime/**"
      - "magisk-ui-kit/**"
      - "smscode/**"
      - ".github/workflows/shared-submodule-compat.yml"
      - "scripts/**"
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}

jobs:
  shared-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true
      - name: Verify shared submodule compatibility
        run: bash scripts/checks/verify_shared_submodule_compat.sh
