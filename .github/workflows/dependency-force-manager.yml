name: Dependency Force Manager

on:
  schedule:
    - cron: "30 2 * * *" # Daily 02:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: read

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}

jobs:
  dependency-force:
    name: Attempt dependency remediation
    runs-on: ubuntu-latest
    continue-on-error: false
    concurrency:
      group: dependency-force-manager-${{ github.ref }}
      cancel-in-progress: false
    env:
      DEPENDENCY_FORCE_CONFIGS: debugRuntimeClasspath
      DEPENDENCY_FORCE_PROJECT: ":app"
      DEPENDENCY_FORCE_HISTORICAL_ALERT_COOLDOWN_HOURS: 168
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: beta
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: "26"
          distribution: "temurin"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Read current forced dependencies
        id: forced
        run: |
          python3 scripts/security/manage_dependency_forces.py read-forces \
            --build-file build.gradle.kts \
            --toml-file gradle/libs.versions.toml \
            --output /tmp/forced.json

      - name: Temporarily remove all force rules
        run: |
          python3 scripts/security/manage_dependency_forces.py strip-force-lines --build-file build.gradle.kts

      - name: Resolve natural versions (multi-variant)
        run: |
          args=()
          IFS=',' read -ra configs <<< "$DEPENDENCY_FORCE_CONFIGS"
          for config in "${configs[@]}"; do
            args+=(--config "$config")
          done
          python3 scripts/security/manage_dependency_forces.py resolve-natural \
            --project "$DEPENDENCY_FORCE_PROJECT" \
            --forced-json /tmp/forced.json \
            --output /tmp/natural.json \
            --include-build-environment \
            "${args[@]}"

      - name: Restore original build file
        run: git checkout -- build.gradle.kts

      - name: Fetch Dependabot alerts
        id: alerts
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          # Dependabot's alerts endpoint returns all states when the state filter
          # is omitted. Using `state=all` is not reliable on this endpoint.
          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/dependabot/alerts?per_page=100" \
            | jq -s '[.[][]]' \
            > /tmp/dependabot-alerts.json

      - name: Determine removable forces
        id: removable
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          python3 scripts/security/manage_dependency_forces.py determine-removable \
            --forced-json /tmp/forced.json \
            --natural-json /tmp/natural.json \
            --alerts-json /tmp/dependabot-alerts.json \
            --historical-alert-cooldown-hours "$DEPENDENCY_FORCE_HISTORICAL_ALERT_COOLDOWN_HOURS" \
            --output /tmp/removable.json
          count=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(len(json.loads(Path("/tmp/removable.json").read_text())))
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Resolve natural versions for security dependencies
        run: |
          args=()
          IFS=',' read -ra configs <<< "$DEPENDENCY_FORCE_CONFIGS"
          for config in "${configs[@]}"; do
            args+=(--config "$config")
          done
          python3 scripts/security/manage_dependency_forces.py resolve-alert-natural \
            --project "$DEPENDENCY_FORCE_PROJECT" \
            --alerts-json /tmp/dependabot-alerts.json \
            --output /tmp/security-natural.json \
            "${args[@]}"

      - name: Apply updates (remove + add security forces)
        id: apply
        run: |
          python3 scripts/security/manage_dependency_forces.py apply-updates \
            --build-file build.gradle.kts \
            --toml-file gradle/libs.versions.toml \
            --removable-json /tmp/removable.json \
            --alerts-json /tmp/dependabot-alerts.json \
            --natural-json /tmp/security-natural.json

      - name: Create PR with dependency force updates
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          base: beta
          branch: chore/dependency-force-update
          delete-branch: true
          title: "build: update forced dependencies"
          commit-message: "build: update forced dependencies"
          labels: |
            dependencies
            java
          body: |
            Automated dependency force maintenance:
            - Removed force rules when natural resolution already matches forced versions.
            - Added or updated force rules for dependencies with open security alerts (Dependabot).

      - name: Write remediation summary
        if: always()
        run: |
          {
            echo "## Dependency remediation"
            echo ""
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Base ref: ${{ github.base_ref || github.ref_name }}"
            echo "- Auto PR operation: ${{ steps.cpr.outputs.pull-request-operation || 'none' }}"
            echo "- Auto PR number: ${{ steps.cpr.outputs.pull-request-number || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"
