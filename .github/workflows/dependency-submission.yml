name: Dependency Submission

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: read
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26

      - name: Generate Dependency Graph
        id: dependency-graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: generate-and-upload
          dependency-graph-exclude-configurations: "^classpath$"
          additional-arguments: "--no-configuration-cache --stacktrace"
          cache-disabled: true

      - name: Validate generated dependency graph
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          chmod +x scripts/security/validate_dependabot_graph.sh
          snapshot="${{ steps.dependency-graph.outputs.dependency-graph-file }}"
          test -n "${snapshot}"
          scripts/security/validate_dependabot_graph.sh --snapshot "${snapshot}"

      - name: Submit Dependency Graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot="${{ steps.dependency-graph.outputs.dependency-graph-file }}"
          test -n "${snapshot}"
          gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" \
            --input "${snapshot}"
