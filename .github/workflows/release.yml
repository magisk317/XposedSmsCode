name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Semantic version tag, e.g. v3.1.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Validate release notes and tag/version consistency
        run: |
          chmod +x scripts/check_release_guard.sh
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/check_release_guard.sh "${GITHUB_REF_NAME}"
          else
            scripts/check_release_guard.sh
          fi

      - name: Run quality gate
        run: >
          bash scripts/with_workspace_gradle_lock.sh --ignore-submodule-lockfiles --warning-mode all
          :core:check
          :runtime:check
          :app:check

  build-github-apk:
    name: Build GitHub APK (${{ matrix.flavor_id }})
    needs: [validate-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor_id: github
            assemble_task: :app:assembleGithubRelease
            artifact_name: apks-github-release
            symbols_artifact_name: native-symbols-github
            symbols_glob: app/build/outputs/native-debug-symbols/githubRelease/native-debug-symbols.zip
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Build GitHub APK with Splits
        run: >
          bash scripts/with_workspace_gradle_lock.sh --ignore-submodule-lockfiles
          ${{ matrix.assemble_task }}
          -PbuildSplits
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: app/build/outputs/apk/**/release/*.apk

      - name: Detect GitHub Native Symbols
        id: github_symbols
        shell: bash
        run: |
          shopt -s nullglob
          files=(${{ matrix.symbols_glob }})
          if (( ${#files[@]} == 0 )); then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          {
            echo "paths<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Native Symbols Artifact
        if: steps.github_symbols.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.symbols_artifact_name }}
          path: ${{ steps.github_symbols.outputs.paths }}

  build-aab:
    name: Build Bundle
    needs: [validate-release]
    runs-on: ubuntu-latest
    outputs:
      has_play_native_symbols: ${{ steps.play_symbols.outputs.exists }}
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Build App Bundle
        run: bash scripts/with_workspace_gradle_lock.sh --ignore-submodule-lockfiles bundlePlayRelease
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bundle-assets
          path: |
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/mapping/playRelease/mapping.txt

      - name: Detect Play Native Symbols
        id: play_symbols
        shell: bash
        run: |
          file="app/build/outputs/native-debug-symbols/playRelease/native-debug-symbols.zip"
          if [[ -f "$file" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Play Native Symbols Artifact
        if: steps.play_symbols.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: native-symbols-play
          path: ${{ steps.play_symbols.outputs.path }}

  release:
    name: Create Release
    needs: [build-github-apk, build-aab]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
      HAS_GOOGLE_PLAY_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: apks-github-*
          merge-multiple: true
          path: artifacts/apks

      - uses: actions/download-artifact@v8
        with:
          name: bundle-assets
          path: artifacts/bundle

      - uses: actions/download-artifact@v8
        if: needs.build-aab.outputs.has_play_native_symbols == 'true'
        with:
          name: native-symbols-play
          path: artifacts/symbols-play

      - name: Extract Version Name from Tag
        id: extract_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF_NAME}       # e.g. v3.1.4
          if [[ "$TAG" == v* ]]; then
            echo "version_name=${TAG}" >> $GITHUB_OUTPUT
          else
            echo "version_name=v${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Extract Release Notes from CHANGELOG
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          release_name="${{ steps.extract_version.outputs.version_name }}"
          notes_file="release-notes.md"
          awk -v version="$release_name" '
            $0 == "---" && found { exit }
            found { print; next }
            index($0, "## [" version "]") == 1 { found = 1; print; next }
            END { if (!found) exit 1 }
          ' docs/CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            echo "ERROR: empty release notes for $release_name" >&2
            exit 1
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_RELEASE_KEYSTORE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          release_name="${{ steps.extract_version.outputs.version_name }}"
          notes_file="${{ steps.release_notes.outputs.notes_file }}"

          mapfile -d '' release_assets < <(
            find artifacts/apks artifacts/bundle -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z
          )
          if [[ ${#release_assets[@]} -eq 0 ]]; then
            echo "ERROR: no release assets found under artifacts/apks or artifacts/bundle" >&2
            find artifacts/apks artifacts/bundle -maxdepth 6 -type f | sort >&2 || true
            exit 1
          fi

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" "${release_assets[@]}" --clobber
            gh release edit "$tag_name" \
              --title "$release_name" \
              --draft=false \
              --notes-file "$notes_file"
          else
            gh release create "$tag_name" "${release_assets[@]}" \
              --title "$release_name" \
              --verify-tag \
              --notes-file "$notes_file"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}

      - name: Determine Release Track
        id: determine_track
        run: |
          TAG_NAME=${{ github.ref_name }}
          if [[ "$TAG_NAME" == *"-beta"* ]]; then
            echo "track=beta" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == *"-alpha"* ]]; then
            echo "track=alpha" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == *"-internal"* ]]; then
            echo "track=internal" >> $GITHUB_OUTPUT
          else
            echo "track=production" >> $GITHUB_OUTPUT
          fi

      - name: Resolve Play Publish Inputs
        id: resolve_play
        shell: bash
        run: |
          aab_file=$(find artifacts/bundle -type f -name 'XposedSmsCode_v*.aab' | sort | head -n 1)
          if [[ -z "$aab_file" ]]; then
            aab_file=$(find artifacts/bundle -type f -name '*.aab' | sort | head -n 1)
          fi
          if [[ -z "$aab_file" ]]; then
            echo "ERROR: no .aab found under artifacts/bundle" >&2
            find artifacts/bundle -maxdepth 4 -type f | sort >&2 || true
            exit 1
          fi

          mapping_file=$(find artifacts/bundle -type f -name mapping.txt | head -n 1)
          if [[ -z "$mapping_file" ]]; then
            echo "ERROR: mapping.txt not found under artifacts/bundle" >&2
            find artifacts/bundle -maxdepth 4 -type f | sort >&2 || true
            exit 1
          fi

          symbols_file=$(find artifacts/symbols-play -type f -name native-debug-symbols.zip 2>/dev/null | head -n 1 || true)

          echo "aab_file=$aab_file" >> "$GITHUB_OUTPUT"
          echo "mapping_file=$mapping_file" >> "$GITHUB_OUTPUT"
          if [[ -n "$symbols_file" ]]; then
            echo "has_symbols=true" >> "$GITHUB_OUTPUT"
            echo "symbols_file=$symbols_file" >> "$GITHUB_OUTPUT"
          else
            echo "has_symbols=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby for fastlane
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_GOOGLE_PLAY_CREDENTIALS == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'

      - name: Install fastlane
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_GOOGLE_PLAY_CREDENTIALS == 'true'
        shell: bash
        run: |
          ruby --version
          gem --version
          gem_user_bin="$(ruby -r rubygems -e 'print Gem.user_dir')/bin"
          echo "$gem_user_bin" >> "$GITHUB_PATH"
          gem install multi_json fastlane --no-document --user-install
          "$gem_user_bin/fastlane" --version

      - name: Publish to Google Play
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_GOOGLE_PLAY_CREDENTIALS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gem_user_bin="$(ruby -r rubygems -e 'print Gem.user_dir')/bin"
          fastlane_bin="$gem_user_bin/fastlane"
          if [[ ! -x "$fastlane_bin" ]]; then
            echo "ERROR: fastlane not found at $fastlane_bin" >&2
            exit 1
          fi

          cmd=(
            "$fastlane_bin" supply
            --aab "${{ steps.resolve_play.outputs.aab_file }}"
            --package_name "com.github.tianma8023.xposed.smscode"
            --track "${{ steps.determine_track.outputs.track }}"
            --release_status "completed"
            --json_key_data "$ANDROID_PUBLISHER_CREDENTIALS"
            --skip_upload_metadata true
            --skip_upload_images true
            --skip_upload_screenshots true
          )

          if [[ "${{ steps.resolve_play.outputs.has_symbols }}" == "true" ]]; then
            cmd+=(--mapping_paths "${{ steps.resolve_play.outputs.mapping_file }},${{ steps.resolve_play.outputs.symbols_file }}")
          else
            cmd+=(--mapping "${{ steps.resolve_play.outputs.mapping_file }}")
          fi

          "${cmd[@]}"
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_COLORS: '1'
          CI: 'true'

  publish-to-modules-repo:
    name: Publish to Xposed-Modules-Repo
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      HAS_MODULES_REPO_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN != '' }}
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
      MODULES_REPO: Xposed-Modules-Repo/com.github.tianma8023.xposed.smscode
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download APK Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apks-github-*
          merge-multiple: true
          path: artifacts/apks

      - name: Extract Version Name from Tag
        id: extract_version
        run: |
          TAG=${GITHUB_REF_NAME}       # e.g. v3.1.4
          if [[ "$TAG" == v* ]]; then
            echo "version_name=${TAG}" >> $GITHUB_OUTPUT
          else
            echo "version_name=v${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Extract Release Notes from CHANGELOG
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          release_name="${{ steps.extract_version.outputs.version_name }}"
          notes_file="release-notes.md"
          awk -v version="$release_name" '
            $0 == "---" && found { exit }
            found { print; next }
            index($0, "## [" version "]") == 1 { found = 1; print; next }
            END { if (!found) exit 1 }
          ' docs/CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            echo "ERROR: empty release notes for $release_name" >&2
            exit 1
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish Release in Xposed-Modules-Repo
        if: env.HAS_MODULES_REPO_TOKEN == 'true' && env.HAS_RELEASE_KEYSTORE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${{ github.ref_name }}"
          release_name="${{ steps.extract_version.outputs.version_name }}"
          notes_file="${{ steps.release_notes.outputs.notes_file }}"

          mapfile -d '' apk_files < <(find artifacts/apks -type f -name '*.apk' -print0 | sort -z)
          if [[ ${#apk_files[@]} -eq 0 ]]; then
            echo "ERROR: no APK files found under artifacts/apks" >&2
            find artifacts/apks -maxdepth 6 -type f | sort >&2 || true
            exit 1
          fi
          if gh release view "$tag_name" --repo "${{ env.MODULES_REPO }}" >/dev/null 2>&1; then
            gh release upload "$tag_name" "${apk_files[@]}" \
              --repo "${{ env.MODULES_REPO }}" \
              --clobber
            gh release edit "$tag_name" \
              --repo "${{ env.MODULES_REPO }}" \
              --title "$release_name" \
              --draft=false \
              --notes-file "$notes_file"
          else
            gh release create "$tag_name" \
              "${apk_files[@]}" \
              --repo "${{ env.MODULES_REPO }}" \
              --title "$release_name" \
              --notes-file "$notes_file"
          fi
        env:
          GH_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN }}
