name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  validate-release-metadata:
    name: Validate Release Metadata
    if: ${{ (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
      - name: Validate release notes and tag/version consistency
        run: |
          chmod +x scripts/release/check_release_guard.sh
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/release/check_release_guard.sh "${GITHUB_REF_NAME}"
          else
            echo "Skip formal release guard on beta branch; this pipeline publishes Alpha."
          fi
  build-github-apk:
    name: Build GitHub APK
    needs: [validate-release-metadata]
    if: ${{ (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > release.jks
      - name: Build GitHub APK with Splits
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: :app:assembleGithubRelease -PbuildSplits
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-github
          path: app/build/outputs/apk/**/release/*.apk

  build-aab:
    name: Build Bundle
    needs: [validate-release-metadata]
    if: ${{ (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    outputs:
      has_play_native_symbols: ${{ steps.play_symbols.outputs.exists }}
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > release.jks
      - name: Resolve Play release version
        shell: bash
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          bash .magisk-ci-toolkit/release/resolve_play_release.sh \
            --package-name com.github.tianma8023.xposed.smscode \
            --version-file gradle/libs.versions.toml \
            --output play-release.env
          {
            cat play-release.env
          } >> "$GITHUB_ENV"
      - name: Build App Bundle
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: :app:bundlePlayRelease -PversionName=${{ env.MAGISK_PLAY_VERSION_NAME }} -PversionCode=${{ env.MAGISK_PLAY_VERSION_CODE }}
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Upload AAB Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bundle-assets
          path: |
            app/build/outputs/bundle/**/*.aab
            app/build/outputs/mapping/**/mapping.txt
            play-release.env
      - name: Detect Play Native Symbols
        id: play_symbols
        shell: bash
        run: |
          file="$(find app/build/outputs/native-debug-symbols -type f -name native-debug-symbols.zip | sort | head -n 1 || true)"
          if [[ -n "$file" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Play Native Symbols Artifact
        if: steps.play_symbols.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: native-symbols-play
          path: ${{ steps.play_symbols.outputs.path }}

  release:
    name: Create Release
    needs: [validate-release-metadata, build-github-apk, build-aab]
    if: always() && (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') && needs.validate-release-metadata.result == 'success' && needs.build-github-apk.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - uses: actions/download-artifact@v8
        with:
          name: apks-github
          path: artifacts/apks
      - uses: actions/download-artifact@v8
        if: needs.build-aab.result == 'success'
        with:
          name: bundle-assets
          path: artifacts/bundle
      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          .magisk-ci-toolkit/release/release_notes.sh \
            --tag "$GITHUB_REF_NAME" \
            --package-name "com.github.tianma8023.xposed.smscode" \
            --source-repo "$GITHUB_REPOSITORY" \
            --generate-github-notes \
            --output release-notes.md
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_RELEASE_KEYSTORE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' release_assets < <(
            find artifacts/apks artifacts/bundle -type f \( -name '*.apk' -o -name '*.aab' \) -print0 2>/dev/null | sort -z
          )
          if [[ ${#release_assets[@]} -eq 0 ]]; then
            echo "ERROR: no release assets found under artifacts/apks or artifacts/bundle" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft=false --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" --title "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md
          fi

  publish-play:
    name: Publish to Google Play
    needs: [build-aab]
    if: ${{ (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    env:
      HAS_GOOGLE_PLAY_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - uses: actions/download-artifact@v8
        with:
          name: bundle-assets
          path: artifacts/bundle
      - name: Load Play release version
        run: cat artifacts/bundle/play-release.env >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        if: needs.build-aab.outputs.has_play_native_symbols == 'true'
        with:
          name: native-symbols-play
          path: artifacts/symbols-play
      - name: Resolve Play Publish Inputs
        id: resolve_play
        shell: bash
        run: |
          aab_file=$(find artifacts/bundle -type f -name '*.aab' | sort | head -n 1)
          if [[ -z "$aab_file" ]]; then
            echo "ERROR: no .aab found under artifacts/bundle" >&2
            exit 1
          fi
          mapping_file=$(find artifacts/bundle -type f -name mapping.txt | sort | head -n 1 || true)
          symbols_file=$(find artifacts/symbols-play -type f -name native-debug-symbols.zip 2>/dev/null | sort | head -n 1 || true)
          echo "aab_file=$aab_file" >> "$GITHUB_OUTPUT"
          if [[ -n "$mapping_file" ]]; then
            echo "has_mapping=true" >> "$GITHUB_OUTPUT"
            echo "mapping_file=$mapping_file" >> "$GITHUB_OUTPUT"
          else
            echo "has_mapping=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$symbols_file" ]]; then
            echo "has_symbols=true" >> "$GITHUB_OUTPUT"
            echo "symbols_file=$symbols_file" >> "$GITHUB_OUTPUT"
          else
            echo "has_symbols=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Google Play
        if: env.HAS_GOOGLE_PLAY_CREDENTIALS == 'true'
        shell: bash
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_COLORS: '1'
          CI: 'true'
        run: |
          set -euo pipefail
          export MAGISK_ANDROID_RELEASE_PACKAGE_NAME="com.github.tianma8023.xposed.smscode"
          export MAGISK_PLAY_AAB_FILE="${{ steps.resolve_play.outputs.aab_file }}"
          if [[ "${{ steps.resolve_play.outputs.has_mapping }}" == "true" ]]; then
            export MAGISK_PLAY_MAPPING_FILE="${{ steps.resolve_play.outputs.mapping_file }}"
          fi
          if [[ "${{ steps.resolve_play.outputs.has_symbols }}" == "true" ]]; then
            export MAGISK_PLAY_SYMBOLS_FILE="${{ steps.resolve_play.outputs.symbols_file }}"
          fi
          export MAGISK_RELEASE_ENV_FILE=play-release-status.env
          bash .magisk-ci-toolkit/release/publish_play.sh

  publish-play-alpha:
    name: Publish Alpha to Google Play
    needs: [build-aab]
    if: ${{ false }}
    runs-on: ubuntu-26.04
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
      HAS_GOOGLE_PLAY_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS != '' }}
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - uses: actions/download-artifact@v8
        with:
          name: bundle-assets
          path: artifacts/bundle
      - name: Resolve Play release inputs
        shell: bash
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          cp artifacts/bundle/play-release.env .
          source ./play-release.env
          {
            echo "MAGISK_PLAY_TRACK=$MAGISK_PLAY_TRACK"
            echo "MAGISK_PLAY_VERSION_NAME=$MAGISK_PLAY_VERSION_NAME"
            echo "MAGISK_PLAY_VERSION_CODE=$MAGISK_PLAY_VERSION_CODE"
          } >> "$GITHUB_ENV"
      - name: Publish Alpha to Google Play
        if: env.HAS_RELEASE_KEYSTORE == 'true' && env.HAS_GOOGLE_PLAY_CREDENTIALS == 'true'
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          MAGISK_ANDROID_RELEASE_PACKAGE_NAME: com.github.tianma8023.xposed.smscode
          MAGISK_PLAY_AAB_FILE: ${{ '' }}
        shell: bash
        run: |
          aab_file="$(find artifacts/bundle -type f -name '*.aab' | sort | head -n 1)"
          mapping_file="$(find artifacts/bundle -type f -name mapping.txt | sort | head -n 1 || true)"
          export MAGISK_PLAY_AAB_FILE="$aab_file"
          export MAGISK_PLAY_MAPPING_FILE="$mapping_file"
          export MAGISK_RELEASE_ENV_FILE=play-release-status.env
          bash .magisk-ci-toolkit/release/publish_play.sh
      - name: Upload Alpha publish status
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: play-alpha-status
          path: play-release-status.env
      - name: Verify Alpha publish credentials
        if: env.HAS_RELEASE_KEYSTORE != 'true' || env.HAS_GOOGLE_PLAY_CREDENTIALS != 'true'
        run: |
          echo "ERROR: Alpha Play publishing requires RELEASE_KEYSTORE and ANDROID_PUBLISHER_CREDENTIALS" >&2
          exit 1

  publish-modules-repo:
    name: Publish to Xposed-Modules-Repo
    needs: [build-github-apk]
    if: ${{ (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    env:
      HAS_MODULES_REPO_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN != '' }}
      MODULES_REPO: Xposed-Modules-Repo/com.github.tianma8023.xposed.smscode
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - uses: actions/download-artifact@v8
        with:
          name: apks-github
          path: artifacts/apks
      - name: Generate Release Notes
        env:
          GH_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN }}
        run: |
          .magisk-ci-toolkit/release/release_notes.sh \
            --tag "$GITHUB_REF_NAME" \
            --package-name "com.github.tianma8023.xposed.smscode" \
            --source-repo "$GITHUB_REPOSITORY" \
            --generate-github-notes \
            --output release-notes.md
      - name: Publish Release in Xposed-Modules-Repo
        if: env.HAS_MODULES_REPO_TOKEN == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -d '' apk_files < <(find artifacts/apks -type f -name '*.apk' -print0 | sort -z)
          if [[ ${#apk_files[@]} -eq 0 ]]; then
            echo "ERROR: no APK files found under artifacts/apks" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$MODULES_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${apk_files[@]}" --repo "$MODULES_REPO" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$MODULES_REPO" --title "$GITHUB_REF_NAME" --draft=false --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${apk_files[@]}" --repo "$MODULES_REPO" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi

  release-notification:
    name: Release Notification
    needs: [release, publish-play, publish-play-alpha, publish-modules-repo]
    if: always() && (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') && needs.publish-play.result != 'failure' && needs.publish-play-alpha.result != 'failure' && needs.publish-modules-repo.result != 'failure' && needs.release.result != 'failure'
    runs-on: ubuntu-26.04
    steps:
      - name: Write release status
        shell: bash
        run: |
          {
            echo "## Release status"
            echo ""
            echo "- Ref: $GITHUB_REF_NAME"
            echo "- Play: ${{ needs.publish-play.result }}"
            echo "- Alpha Play: ${{ needs.publish-play-alpha.result }}"
            echo "- GitHub Release: ${{ needs.release.result }}"
            echo "- Modules Repo: ${{ needs.publish-modules-repo.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

  post-release-quality:
    name: Post-release Quality
    needs: [release, publish-play, publish-play-alpha, publish-modules-repo]
    if: always() && (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') && needs.publish-play.result != 'failure' && needs.publish-play-alpha.result != 'failure' && needs.publish-modules-repo.result != 'failure' && needs.release.result != 'failure'
    runs-on: ubuntu-26.04
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::error::GITLAB_TOKEN secret is not set; cannot clone gitlab.com submodules"
            exit 1
          fi
          git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          echo "GITLAB_TOKEN=$GITLAB_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
      - name: Run post-release quality gate
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: >
            --warning-mode all
            :core:check
            :runtime:check
            :app:check
            :smscode-core:contract:test
            :smscode-core:domain:test
            :smscode-core:hook:testDebugUnitTest
            :smscode-core:runtime:testDebugUnitTest
            :smscode-core:verification:detekt
            :smscode-core:verification:test
            :magisk-xposed-kit:testDebugUnitTest
            :magisk-xposed-kit:logging:testDebugUnitTest
            :magisk-xposed-kit:diagnostics:testDebugUnitTest
            :app:koverVerifyGithubDebug
            -PenableKover=true
