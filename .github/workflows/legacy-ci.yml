name: Legacy CI

permissions:
  contents: read

concurrency:
  group: legacy-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - legacy
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/legacy'
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Resolve CI toolkit
        run: bash scripts/resolve_ci_toolkit.sh
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'

      - name: Build Legacy Debug APK
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: >
            --warning-mode all
            :app:assembleGithubLegacyDebug

      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Legacy Debug APK summary"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            while IFS= read -r apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              echo "| $name | $size |"
            done < <(find app/build/outputs/apk/githubLegacy/debug -name '*.apk' | sort)
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Legacy Debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XposedSmsCode-legacy-debug-apk
          path: app/build/outputs/apk/githubLegacy/debug/*.apk
